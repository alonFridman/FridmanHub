<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הלוז המשפחתי</title><style>:root{--bg:#f6f7fb;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:1180px;margin:auto;padding:24px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.title h1{margin:0;font-size:clamp(28px,4vw,46px)}.date{color:var(--muted);font-size:18px;margin-top:6px}.nav{display:flex;gap:10px}.nav button{border:1px solid var(--border);background:#fff;border-radius:14px;padding:12px 16px;font-size:16px;cursor:pointer}.nav .primary{background:var(--accent);color:#fff}.nav-btn{display:inline-flex;gap:8px;align-items:center;direction:ltr}.nav-btn .label{direction:rtl}.weather,.motivation,.section{border:1px solid var(--border);border-radius:22px;background:#fff;margin-top:18px;padding:18px}.weather{display:flex;justify-content:space-between;align-items:center;gap:15px;background:linear-gradient(135deg,#eef6ff,#fff)}.weather-main,.weather-stats{display:flex;align-items:center;gap:14px}.weather-icon{font-size:34px}.weather-title{font-weight:800}.weather-sub,.stat span{color:var(--muted);font-size:13px}.stat{text-align:center;min-width:80px}.stat strong{display:block;font-size:20px}.motivation{text-align:center;background:linear-gradient(135deg,#fff7ed,#fefce8);border-color:#fde68a}.motivation .spark{font-size:24px}.motivation strong{display:block;font-size:21px;margin-top:5px}.day-note{margin-top:14px;background:#eff6ff;border:1px solid #dbeafe;padding:13px 16px;border-radius:16px;font-weight:700}.section h2{margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border-radius:18px;padding:16px;border:1px solid var(--border);background:#fff}.school .card:nth-child(1){background:#eff6ff;border-color:#bfdbfe}.school .card:nth-child(2){background:#f0fdf4;border-color:#bbf7d0}.school .card:nth-child(3){background:#fdf4ff;border-color:#f5d0fe}.food .card{background:#fff7ed}.activities .card{background:#f0fdf4}.person{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.person h3{margin:0;font-size:20px}.badge{background:#111827;color:#fff;padding:5px 9px;border-radius:99px;font-size:12px}ul{list-style:none;padding:0;margin:0}.lessons li,.activity-list li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.06);align-items:center}.lessons li:last-child,.activity-list li:last-child{border:0}.num{background:#fff;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;flex:0 0 26px}.lesson-name{flex:1}.yesterday-badge{font-size:11px;font-weight:700;padding:4px 7px;border-radius:999px;white-space:nowrap}.was-yesterday{background:#dbeafe;color:#1d4ed8}.not-yesterday{background:#f3f4f6;color:#6b7280}.legend{display:flex;gap:10px;flex-wrap:wrap;margin:-5px 0 14px;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:5px}.food-main{font-size:20px;font-weight:800}.time{font-weight:800;min-width:54px}.empty{color:var(--muted);padding:10px 0}.footer{text-align:center;color:var(--muted);font-size:13px;margin:24px}@media(max-width:700px){.app{padding:14px}.nav{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.weather{flex-direction:column;align-items:flex-start}.weather-stats{width:100%;justify-content:space-between}.stat{min-width:0;flex:1}}@media(max-width:480px){.grid{grid-template-columns:1fr}.yesterday-badge{font-size:10px;padding:3px 6px}}</style></head><body><main class="app"><div class="topbar"><div class="title"><h1>הלוז המשפחתי</h1><div id="dateText" class="date"></div></div><div class="nav"><button class="nav-btn" id="nextBtn"><span class="label">יום הבא</span><span>›</span></button><button id="todayBtn" class="primary">היום</button><button class="nav-btn" id="prevBtn"><span>‹</span><span class="label">יום קודם</span></button></div></div><section class="weather"><div class="weather-main"><div id="weatherIcon" class="weather-icon">🌤️</div><div><div id="weatherTitle" class="weather-title">מזג האוויר</div><div id="weatherSub" class="weather-sub">טוען...</div></div></div><div id="weatherStats" class="weather-stats"></div></section><section class="motivation"><span class="spark">✨</span><strong id="motivationText"></strong></section><div id="dayNote" class="day-note"></div><section class="section school"><h2>🏫 מערכת שעות</h2><div class="legend"><span><b class="yesterday-badge was-yesterday">היה ביום הלימודים הקודם</b></span><span><b class="yesterday-badge not-yesterday">לא היה ביום הלימודים הקודם</b></span></div><div id="schoolGrid" class="grid"></div></section><section class="section food"><h2>🥪 ארוחות עשר</h2><div id="foodGrid" class="grid"></div></section><section class="section activities"><h2>⚽ חוגים</h2><div id="activityGrid" class="grid"></div></section><div class="footer">Family Daily Board</div></main><script>
const weekdays=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'],children={omer:{name:'עומר',className:'ב׳2'},yotam:{name:'יותם',className:'ב׳3'},noam:{name:'נועם'}};
const school={omer:{0:['חשבון','חשבון','אקדמיה','עברית','עברית'],1:['עברית','מוסיקה','חשבון','חשבון','בשבילי המורשת'],2:['עברית','תל״ן','מפתח הלב','חשבון','חשבון','חנ״ג'],3:['מדעים בחווה','מדעים בחווה','חנ״ג','אומנות','אנגלית'],4:['עברית','עברית','כישורי חיים','אנגלית','תורה'],5:['עברית','עברית','העשרה עברית','תורה']},yotam:{0:['עברית','חנ״ג','חשבון','העשרה חשבון','מדעים בחווה','מדעים בחווה'],1:['חשבון','חשבון','עברית','עברית','בשבילי המורשת'],2:['העשרה עברית','חנ״ג','אקדמיית ספורט','אומנות','חבר על ארבע'],3:['מוזיקה','חשבון','אנגלית','עברית','עברית'],4:['עברית','כישורי חיים','חשבון','אנגלית','תורה'],5:['עברית','עברית','תורה','מפתח הלב']}};
const snacks={yotam:{0:'טוסט קטשופ מלחם',1:'פיצה פיתה',2:'בגט טונה טוסט',3:'פיצה פיתה',4:'טוסט בגט',5:'טוסט קטשופ'},omer:{0:'לחמנייה עם חביתה',1:'פיתה וביצה קשה',2:'טוסט לבן פיתה',3:'פיצה פיתה',4:'פיתה עם ביצה קשה',5:'לחמנייה עם ריבה'}};
const activities={0:{omer:[['15:45','אימון כדורגל','45 דק׳'],['17:15','שיעור מוזיקה','כשעה']],yotam:[['15:45','אימון כדורגל','45 דק׳'],['17:15','שיעור מוזיקה','כשעה']]},1:{yotam:[['17:00','חוג רובוטיקה']],noam:[['16:30','כדורגל']]},3:{omer:[['15:45','אימון כדורגל','45 דק׳'],['17:00','חוג STEM']],yotam:[['15:45','אימון כדורגל','45 דק׳']]},4:{yotam:[['17:30','לאה — מרפאה באמנות']]},5:{omer:[['14:00','חוג שחייה']],yotam:[['14:00','חוג שחייה']],noam:[['14:00','חוג שחייה']]}};
const motivations=['כל יום הוא הזדמנות ללמוד משהו חדש 🌟','חיוך קטן יכול לשנות יום שלם 😊','תאמינו בעצמכם — אתם יכולים יותר ממה שאתם חושבים 💪','הדרך להצליח מתחילה בלנסות 🚀','תהיו סקרנים, תשאלו ותגלו דברים חדשים 🔎','הדברים הגדולים מתחילים בצעדים קטנים 👣','היום הוא יום מצוין לעשות משהו טוב ❤️','גם כשקשה — ממשיכים עוד קצת ומצליחים ⭐','תהיו החבר שהייתם רוצים שיהיה לכם 🤝','אין צורך להיות מושלמים — רק לעשות את הכי טוב שלכם 🌈','כל טעות היא דרך חדשה ללמוד 🧠','מילה טובה עושה טוב גם למי שאומר אותה 💛','תיהנו מהדרך, לא רק מהתוצאה 🎈','יש לכם כוח להפוך את היום הזה למיוחד ✨'];
let selectedDate=new Date();selectedDate.setHours(12,0,0,0);let weatherDaily=null,weatherLocation={name:'קריית אונו',latitude:32.0564,longitude:34.8579};
function header(k){let c=children[k];return `<div class="person"><h3>${c.name}</h3>${c.className?`<span class="badge">כיתה ${c.className}</span>`:''}</div>`}
function previousSchoolDay(d){if(d===0)return 5;if(d===6)return 5;return d-1}
function schoolCard(k,d){let s=school[k]?.[d];let prevDay=previousSchoolDay(d);let prevSubjects=school[k]?.[prevDay]||[];return `<article class="card">${header(k)}${s?`<ul class="lessons">${s.map((x,i)=>{let was=prevSubjects.includes(x);return `<li><span class="num">${i+1}</span><span class="lesson-name">${x}</span><span class="yesterday-badge ${was?'was-yesterday':'not-yesterday'}">${was?'היה קודם':'לא היה קודם'}</span></li>`}).join('')}</ul>`:'<div class="empty">אין מערכת שעות</div>'}</article>`}
function foodCard(k,d){let f=snacks[k]?.[d];return `<article class="card">${header(k)}${f?`<div class="food-main">${f}</div>`:'<div class="empty">אין ארוחת עשר מוגדרת</div>'}</article>`}
function activityCard(k,d){let a=activities[d]?.[k]||[];return `<article class="card">${header(k)}${a.length?`<ul class="activity-list">${a.map(x=>`<li><span class="time">${x[0]}</span><span><strong>${x[1]}</strong>${x[2]?' · '+x[2]:''}</span></li>`).join('')}</ul>`:'<div class="empty">אין חוגים היום</div>'}</article>`}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weatherInfo(c){if(c===0)return['☀️','בהיר'];if([1,2].includes(c))return['🌤️','מעונן חלקית'];if(c===3)return['☁️','מעונן'];if([61,63,65,80,81,82].includes(c))return['🌧️','גשם'];if([95,96,99].includes(c))return['⛈️','סופות רעמים'];return['🌦️','מזג אוויר משתנה']}
function renderWeather(){if(!weatherDaily)return;let i=weatherDaily.time.indexOf(dateKey(selectedDate));weatherTitle.textContent=`מזג האוויר · ${weatherLocation.name}`;if(i<0){weatherStats.innerHTML='אין תחזית זמינה';return}let w=weatherInfo(weatherDaily.weather_code[i]);weatherIcon.textContent=w[0];weatherSub.textContent=w[1];weatherStats.innerHTML=`<div class="stat"><strong>${Math.round(weatherDaily.temperature_2m_max[i])}°</strong><span>מקסימום</span></div><div class="stat"><strong>${Math.round(weatherDaily.temperature_2m_min[i])}°</strong><span>מינימום</span></div><div class="stat"><strong>☔ ${weatherDaily.precipitation_probability_max[i]??0}%</strong><span>סיכוי לגשם</span></div>`}
async function fetchWeather(){try{let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${weatherLocation.latitude}&longitude=${weatherLocation.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`),j=await r.json();weatherDaily=j.daily;renderWeather()}catch(e){weatherSub.textContent='לא ניתן לקבל נתוני מזג אוויר'}}
function motivationFor(d){let start=new Date(d.getFullYear(),0,0),day=Math.floor((d-start)/86400000);return motivations[day%motivations.length]}
function render(){let d=selectedDate.getDay(),keys=['omer','yotam','noam'];dateText.textContent=new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(selectedDate);motivationText.textContent=motivationFor(selectedDate);dayNote.textContent=d===6?'שבת — אין לימודים.':`יום ${weekdays[d]} — כל מה שצריך לדעת במקום אחד.`;schoolGrid.innerHTML=keys.map(k=>schoolCard(k,d)).join('');foodGrid.innerHTML=keys.map(k=>foodCard(k,d)).join('');activityGrid.innerHTML=keys.map(k=>activityCard(k,d)).join('');renderWeather()}
prevBtn.onclick=()=>{selectedDate.setDate(selectedDate.getDate()-1);render()};nextBtn.onclick=()=>{selectedDate.setDate(selectedDate.getDate()+1);render()};todayBtn.onclick=()=>{selectedDate=new Date();selectedDate.setHours(12,0,0,0);render()};render();if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{weatherLocation={name:'המיקום שלי',latitude:p.coords.latitude,longitude:p.coords.longitude};fetchWeather()},fetchWeather,{timeout:3500});else fetchWeather();
</script></body></html>
