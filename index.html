<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הלוז המשפחתי</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--food:#fff7ed;--activity:#f0fdf4;--school:#f8fafc}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:1280px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}.title-wrap h1{margin:0;font-size:clamp(28px,4vw,46px)}.date{color:var(--muted);font-size:18px;margin-top:6px}.nav{display:flex;gap:10px}.nav button{border:1px solid var(--border);background:#fff;border-radius:14px;padding:12px 16px;font-size:16px;cursor:pointer}.nav .primary{background:var(--accent);color:#fff;border-color:var(--accent)}.nav-btn{display:inline-flex;align-items:center;gap:8px;direction:ltr}.nav-btn .label{direction:rtl;unicode-bidi:isolate}.arrow{font-size:22px;font-weight:700}.weather-card{display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(135deg,#eef6ff,#fff);border:1px solid #dbeafe;padding:16px 18px;border-radius:18px;margin-bottom:14px}.weather-main,.weather-stats{display:flex;align-items:center;gap:12px}.weather-icon{font-size:34px}.weather-title{font-weight:800;font-size:17px}.weather-sub,.weather-stat span{color:var(--muted);font-size:13px}.weather-stat{text-align:center;min-width:84px}.weather-stat strong{display:block;font-size:20px}.day-note{background:#eff6ff;border:1px solid #dbeafe;padding:14px 16px;border-radius:16px;margin-bottom:20px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.child-card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 12px 30px rgba(31,41,55,.08);border:1px solid #e5e7eb}.child-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.child-name{font-size:28px;font-weight:800;margin:0}.class-badge{background:#111827;color:#fff;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700}.section{border-radius:18px;padding:16px;margin-top:14px}.section h3{margin:0 0 12px;font-size:18px}.school{background:var(--school)}.food{background:var(--food)}.activity{background:var(--activity)}ul{margin:0;padding:0;list-style:none}.lesson-list li,.activity-list li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.06)}li:last-child{border-bottom:0}.num{width:28px;height:28px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 28px}.food-main{font-size:20px;font-weight:800}.activity-time{font-weight:800;min-width:54px}.empty{color:var(--muted);text-align:center;padding:28px 8px}.footer-note{color:var(--muted);text-align:center;font-size:13px;margin-top:24px}@media(max-width:950px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.app{padding:14px}.nav{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr}.weather-card{align-items:flex-start;flex-direction:column}.weather-stats{width:100%;justify-content:space-between}.weather-stat{min-width:0;flex:1}}
  </style>
</head><body><main class="app"><section class="topbar"><div class="title-wrap"><h1>הלוז המשפחתי</h1><div class="date" id="dateText"></div></div><div class="nav"><button class="nav-btn" id="nextBtn"><span class="label">יום הבא</span><span class="arrow">›</span></button><button class="primary" id="todayBtn">היום</button><button class="nav-btn" id="prevBtn"><span class="arrow">‹</span><span class="label">יום קודם</span></button></div></section><section class="weather-card"><div class="weather-main"><div class="weather-icon" id="weatherIcon">🌤️</div><div><div class="weather-title" id="weatherTitle">מזג האוויר</div><div class="weather-sub" id="weatherSub">טוען...</div></div></div><div class="weather-stats" id="weatherStats"></div></section><div class="day-note" id="dayNote"></div><section class="grid" id="cards"></section><div class="footer-note">Family Daily Board</div></main>
<script>
const weekdays=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const children={omer:{name:'עומר',className:'ב׳2'},yotam:{name:'יותם',className:'ב׳3'},noam:{name:'נועם'}};
const school={omer:{0:['עברית','חשבון','אנגלית','עברית','מדעים','חינוך גופני'],1:['חשבון','עברית','מדעים','אנגלית','אמנות','כישורי חיים'],2:['עברית','חשבון','אנגלית','מולדת','מדעים','מוזיקה'],3:['חשבון','עברית','חינוך גופני','אנגלית','מדעים','אמנות'],4:['עברית','חשבון','אנגלית','מולדת','מוזיקה','כישורי חיים'],5:['עברית','חשבון','חינוך גופני','פעילות כיתתית']},yotam:{0:['חשבון','עברית','מדעים','אנגלית','חינוך גופני','אמנות'],1:['עברית','חשבון','אנגלית','מולדת','מדעים','מוזיקה'],2:['חשבון','עברית','חינוך גופני','אנגלית','אמנות','כישורי חיים'],3:['עברית','חשבון','מדעים','אנגלית','מולדת','חינוך גופני'],4:['חשבון','עברית','אנגלית','מוזיקה','מדעים','אמנות'],5:['עברית','חשבון','חינוך גופני','פעילות כיתתית']}};
const snacks={yotam:{0:'טוסט קטשופ מלחם',1:'פיצה פיתה',2:'בגט טונה טוסט',3:'פיצה פיתה',4:'טוסט בגט',5:'טוסט קטשופ'},omer:{0:'לחמנייה עם חביתה',1:'פיתה וביצה קשה',2:'טוסט לבן פיתה',3:'פיצה פיתה',4:'פיתה עם ביצה קשה',5:'לחמנייה עם ריבה'}};
const activities={0:{omer:[['15:45','אימון כדורגל','45 דק׳'],['17:15','שיעור מוזיקה','כשעה']],yotam:[['15:45','אימון כדורגל','45 דק׳'],['17:15','שיעור מוזיקה','כשעה']]},1:{yotam:[['17:00','חוג רובוטיקה']],noam:[['16:30','כדורגל']]},3:{omer:[['15:45','אימון כדורגל','45 דק׳'],['17:00','חוג STEM']],yotam:[['15:45','אימון כדורגל','45 דק׳']]},4:{yotam:[['17:30','לאה — מרפאה באמנות']]},5:{omer:[['14:00','חוג שחייה']],yotam:[['14:00','חוג שחייה']],noam:[['14:00','חוג שחייה']]}};
let selectedDate=new Date();selectedDate.setHours(12,0,0,0),weatherDaily=null,weatherLocation={name:'קריית אונו',latitude:32.0564,longitude:34.8579};
const section=(t,c,x)=>`<div class="section ${c}"><h3>${t}</h3>${x}</div>`;
function card(k,d){let c=children[k],s=school[k]?.[d],f=snacks[k]?.[d],a=activities[d]?.[k]||[],body='';if(s)body+=section('🏫 מערכת שעות','school',`<ul class="lesson-list">${s.map((x,i)=>`<li><span class="num">${i+1}</span>${x}</li>`).join('')}</ul>`);if(f)body+=section('🥪 ארוחת עשר','food',`<div class="food-main">${f}</div>`);if(a.length)body+=section('⚽ חוגים והמשך היום','activity',`<ul class="activity-list">${a.map(x=>`<li><span class="activity-time">${x[0]}</span><span><strong>${x[1]}</strong>${x[2]?' · '+x[2]:''}</span></li>`).join('')}</ul>`);return `<article class="child-card"><div class="child-head"><h2 class="child-name">${c.name}</h2>${c.className?`<span class="class-badge">כיתה ${c.className}</span>`:''}</div>${body||'<div class="empty">אין מידע מתוכנן ליום הזה</div>'}</article>`}
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function weatherInfo(c){if(c===0)return['☀️','בהיר'];if([1,2].includes(c))return['🌤️','מעונן חלקית'];if(c===3)return['☁️','מעונן'];if([61,63,65,80,81,82].includes(c))return['🌧️','גשם'];if([95,96,99].includes(c))return['⛈️','סופות רעמים'];return['🌦️','מזג אוויר משתנה']}
function renderWeather(){if(!weatherDaily)return;let i=weatherDaily.time.indexOf(key(selectedDate));weatherTitle.textContent=`מזג האוויר · ${weatherLocation.name}`;if(i<0){weatherStats.innerHTML='אין תחזית זמינה לתאריך הזה';return}let w=weatherInfo(weatherDaily.weather_code[i]);weatherIcon.textContent=w[0];weatherSub.textContent=w[1];weatherStats.innerHTML=`<div class="weather-stat"><strong>${Math.round(weatherDaily.temperature_2m_max[i])}°</strong><span>מקסימום</span></div><div class="weather-stat"><strong>${Math.round(weatherDaily.temperature_2m_min[i])}°</strong><span>מינימום</span></div><div class="weather-stat"><strong>☔ ${weatherDaily.precipitation_probability_max[i]??0}%</strong><span>סיכוי לגשם</span></div>`}
async function fetchWeather(){try{let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${weatherLocation.latitude}&longitude=${weatherLocation.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`),j=await r.json();weatherDaily=j.daily;renderWeather()}catch(e){weatherSub.textContent='לא ניתן לקבל נתוני מזג אוויר'}}
function render(){let d=selectedDate.getDay();dateText.textContent=new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(selectedDate);dayNote.textContent=d===6?'שבת — אין לימודים.':`יום ${weekdays[d]} — כל מה שצריך לדעת במקום אחד.`;cards.innerHTML=['omer','yotam','noam'].map(k=>card(k,d)).join('');renderWeather()}
prevBtn.onclick=()=>{selectedDate.setDate(selectedDate.getDate()-1);render()};nextBtn.onclick=()=>{selectedDate.setDate(selectedDate.getDate()+1);render()};todayBtn.onclick=()=>{selectedDate=new Date();selectedDate.setHours(12,0,0,0);render()};render();if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{weatherLocation={name:'המיקום שלי',latitude:p.coords.latitude,longitude:p.coords.longitude};fetchWeather()},fetchWeather,{timeout:3500});else fetchWeather();
</script></body></html>
