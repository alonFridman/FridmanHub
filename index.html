<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>הלוז המשפחתי</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--food:#fff7ed;--activity:#f0fdf4;--school:#f8fafc}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:1180px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}.title-wrap h1{margin:0;font-size:clamp(28px,4vw,46px)}.date{color:var(--muted);font-size:18px;margin-top:6px}.nav{display:flex;gap:10px}.nav button{border:1px solid var(--border);background:#fff;border-radius:14px;padding:12px 16px;font-size:16px;cursor:pointer}.nav .primary{background:var(--accent);color:#fff;border-color:var(--accent)}.nav-btn{display:inline-flex;align-items:center;gap:8px;direction:ltr}.nav-btn .label{direction:rtl;unicode-bidi:isolate}.arrow{font-size:22px;font-weight:700}.weather-card{display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(135deg,#eef6ff,#fff);border:1px solid #dbeafe;padding:16px 18px;border-radius:18px;margin-bottom:14px}.weather-main,.weather-stats{display:flex;align-items:center;gap:12px}.weather-icon{font-size:34px}.weather-title{font-weight:800;font-size:17px}.weather-sub,.weather-stat span{color:var(--muted);font-size:13px}.weather-stat{text-align:center;min-width:84px}.weather-stat strong{display:block;font-size:20px}.day-note{background:#eff6ff;border:1px solid #dbeafe;padding:14px 16px;border-radius:16px;margin-bottom:20px;font-weight:700}.family-section{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;margin-bottom:18px;box-shadow:0 10px 28px rgba(31,41,55,.06)}.family-section h2{margin:0 0 16px;font-size:24px}.section-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.person-card{border-radius:18px;padding:16px;background:#fff;border:1px solid var(--border)}.school-section .person-card{background:var(--school)}.food-section .person-card{background:var(--food)}.activity-section .person-card{background:var(--activity)}.person-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.person-title h3{margin:0;font-size:20px}.badge{background:#111827;color:#fff;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}ul{margin:0;padding:0;list-style:none}.lesson-list li,.activity-list li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.06)}li:last-child{border-bottom:0}.num{width:26px;height:26px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 26px}.food-main{font-size:20px;font-weight:800}.activity-time{font-weight:800;min-width:54px}.empty{color:var(--muted);padding:10px 0}.footer-note{color:var(--muted);text-align:center;font-size:13px;margin-top:24px}@media(max-width:850px){.section-grid{grid-template-columns:1fr}}@media(max-width:600px){.app{padding:14px}.nav{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr}.weather-card{align-items:flex-start;flex-direction:column}.weather-stats{width:100%;justify-content:space-between}.weather-stat{min-width:0;flex:1}.family-section{padding:16px}}
</style>
</head>
<body><main class="app">
<section class="topbar"><div class="title-wrap"><h1>הלוז המשפחתי</h1><div class="date" id="dateText"></div></div><div class="nav"><button class="nav-btn" id="nextBtn"><span class="label">יום הבא</span><span class="arrow">›</span></button><button class="primary" id="todayBtn">היום</button><button class="nav-btn" id="prevBtn"><span class="arrow">‹</span><span class="label">יום קודם</span></button></div></section>
<section class="weather-card"><div class="weather-main"><div class="weather-icon" id="weatherIcon">🌤️</div><div><div class="weather-title" id="weatherTitle">מזג האוויר</div><div class="weather-sub" id="weatherSub">טוען...</div></div></div><div class="weather-stats" id="weatherStats"></div></section>
<div class="day-note" id="dayNote"></div>
<section class="family-section school-section"><h2>🏫 מערכת שעות</h2><div class="section-grid" id="schoolGrid"></div></section>
<section class="family-section food-section"><h2>🥪 ארוחות עשר</h2><div class="section-grid" id="foodGrid"></div></section>
<section class="family-section activity-section"><h2>⚽ חוגים</h2><div class="section-grid" id="activityGrid"></div></section>
<div class="footer-note">Family Daily Board</div></main>
<script>
const weekdays=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const children={omer:{name:'עומר',className:'ב׳2'},yotam:{name:'יותם',className:'ב׳3'},noam:{name:'נועם'}};
const school={omer:{0:['עברית','חשבון','אנגלית','עברית','מדעים','חינוך גופני'],1:['חשבון','עברית','מדעים','אנגלית','אמנות','כישורי חיים'],2:['עברית','חשבון','אנגלית','מולדת','מדעים','מוזיקה'],3:['חשבון','עברית','חינוך גופני','אנגלית','מדעים','אמנות'],4:['עברית','חשבון','אנגלית','מולדת','מוזיקה','כישורי חיים'],5:['עברית','חשבון','חינוך גופני','פעילות כיתתית']},yotam:{0:['חשבון','עברית','מדעים','אנגלית','חינוך גופני','אמנות'],1:['עברית','חשבון','אנגלית','מולדת','מדעים','מוזיקה'],2:['חשבון','עברית','חינוך גופני','אנגלית','אמנות','כישורי חיים'],3:['עברית','חשבון','מדעים','אנגלית','מולדת','חינוך גופני'],4:['חשבון','עברית','אנגלית','מוזיקה','מדעים','אמנות'],5:['עברית','חשבון','חינוך גופני','פעילות כיתתית']}};
const snacks={yotam:{0:'טוסט קטשופ מלחם',1:'פיצה פיתה',2:'בגט טונה טוסט',3:'פיצה פיתה',4:'טוסט בגט',5:'טוסט קטשופ'},omer:{0:'לחמנייה עם חביתה',1:'פיתה וביצה קשה',2:'טוסט לבן פיתה',3:'פיצה פיתה',4:'פיתה עם ביצה קשה',5:'לחמנייה עם ריבה'}};
const activities={0:{omer:[['15:45','אימון כדורגל','45 דק׳'],['17:15','שיעור מוזיקה','כשעה']],yotam:[['15:45','אימון כדורגל','45 דק׳'],['17:15','שיעור מוזיקה','כשעה']]},1:{yotam:[['17:00','חוג רובוטיקה']],noam:[['16:30','כדורגל']]},3:{omer:[['15:45','אימון כדורגל','45 דק׳'],['17:00','חוג STEM']],yotam:[['15:45','אימון כדורגל','45 דק׳']]},4:{yotam:[['17:30','לאה — מרפאה באמנות']]},5:{omer:[['14:00','חוג שחייה']],yotam:[['14:00','חוג שחייה']],noam:[['14:00','חוג שחייה']]}};
let selectedDate=new Date();selectedDate.setHours(12,0,0,0),weatherDaily=null,weatherLocation={name:'קריית אונו',latitude:32.0564,longitude:34.8579};
function personHeader(k){const c=children[k];return `<div class="person-title"><h3>${c.name}</h3>${c.className?`<span class="badge">כיתה ${c.className}</span>`:''}</div>`}
function schoolCard(k,d){let s=school[k]?.[d];return `<article class="person-card">${personHeader(k)}${s?`<ul class="lesson-list">${s.map((x,i)=>`<li><span class="num">${i+1}</span>${x}</li>`).join('')}</ul>`:'<div class="empty">אין מערכת שעות</div>'}</article>`}
function foodCard(k,d){let f=snacks[k]?.[d];return `<article class="person-card">${personHeader(k)}${f?`<div class="food-main">${f}</div>`:'<div class="empty">אין ארוחת עשר מוגדרת</div>'}</article>`}
function activityCard(k,d){let a=activities[d]?.[k]||[];return `<article class="person-card">${personHeader(k)}${a.length?`<ul class="activity-list">${a.map(x=>`<li><span class="activity-time">${x[0]}</span><span><strong>${x[1]}</strong>${x[2]?' · '+x[2]:''}</span></li>`).join('')}</ul>`:'<div class="empty">אין חוגים היום</div>'}</article>`}
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function weatherInfo(c){if(c===0)return['☀️','בהיר'];if([1,2].includes(c))return['🌤️','מעונן חלקית'];if(c===3)return['☁️','מעונן'];if([61,63,65,80,81,82].includes(c))return['🌧️','גשם'];if([95,96,99].includes(c))return['⛈️','סופות רעמים'];return['🌦️','מזג אוויר משתנה']}
function renderWeather(){if(!weatherDaily)return;let i=weatherDaily.time.indexOf(key(selectedDate));weatherTitle.textContent=`מזג האוויר · ${weatherLocation.name}`;if(i<0){weatherStats.innerHTML='אין תחזית זמינה לתאריך הזה';return}let w=weatherInfo(weatherDaily.weather_code[i]);weatherIcon.textContent=w[0];weatherSub.textContent=w[1];weatherStats.innerHTML=`<div class="weather-stat"><strong>${Math.round(weatherDaily.temperature_2m_max[i])}°</strong><span>מקסימום</span></div><div class="weather-stat"><strong>${Math.round(weatherDaily.temperature_2m_min[i])}°</strong><span>מינימום</span></div><div class="weather-stat"><strong>☔ ${weatherDaily.precipitation_probability_max[i]??0}%</strong><span>סיכוי לגשם</span></div>`}
async function fetchWeather(){try{let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${weatherLocation.latitude}&longitude=${weatherLocation.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`),j=await r.json();weatherDaily=j.daily;renderWeather()}catch(e){weatherSub.textContent='לא ניתן לקבל נתוני מזג אוויר'}}
function render(){let d=selectedDate.getDay(),keys=['omer','yotam','noam'];dateText.textContent=new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(selectedDate);dayNote.textContent=d===6?'שבת — אין לימודים.':`יום ${weekdays[d]} — כל מה שצריך לדעת במקום אחד.`;schoolGrid.innerHTML=keys.map(k=>schoolCard(k,d)).join('');foodGrid.innerHTML=keys.map(k=>foodCard(k,d)).join('');activityGrid.innerHTML=keys.map(k=>activityCard(k,d)).join('');renderWeather()}
prevBtn.onclick=()=>{selectedDate.setDate(selectedDate.getDate()-1);render()};nextBtn.onclick=()=>{selectedDate.setDate(selectedDate.getDate()+1);render()};todayBtn.onclick=()=>{selectedDate=new Date();selectedDate.setHours(12,0,0,0);render()};render();if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{weatherLocation={name:'המיקום שלי',latitude:p.coords.latitude,longitude:p.coords.longitude};fetchWeather()},fetchWeather,{timeout:3500});else fetchWeather();
</script></body></html>
