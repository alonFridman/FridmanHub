<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070b18">
  <title>Fridman Hub — Future</title>
  <style>
    :root{--bg:#070b18;--panel:rgba(17,25,48,.72);--panel2:rgba(12,19,39,.88);--line:rgba(157,176,255,.16);--text:#f5f7ff;--muted:#a8b1d1;--cyan:#55e6ff;--violet:#9d7bff;--pink:#ff76cf;--green:#67f5b1;--orange:#ffbf69;--shadow:0 24px 80px rgba(0,0,0,.34)}
    *{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% -10%,rgba(90,60,210,.30),transparent 36%),radial-gradient(circle at 5% 40%,rgba(0,190,255,.16),transparent 28%),var(--bg);color:var(--text);font-family:Arial,"Noto Sans Hebrew",sans-serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}
    button{font:inherit}.shell{width:min(1460px,100%);margin:auto;padding:28px}.top{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin-bottom:22px}.eyebrow{display:flex;align-items:center;gap:9px;color:var(--cyan);font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green);animation:pulse 2s infinite}.top h1{font-size:clamp(34px,5vw,68px);line-height:.95;margin:12px 0 10px;letter-spacing:-.045em}.date{color:var(--muted);font-size:18px}.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:7px;border:1px solid var(--line);border-radius:20px;background:rgba(7,11,24,.6);backdrop-filter:blur(16px)}.nav button{border:0;color:var(--text);background:transparent;border-radius:14px;padding:13px 17px;cursor:pointer;white-space:nowrap;transition:.2s}.nav button:hover{background:rgba(255,255,255,.07);transform:translateY(-1px)}.nav .today{color:#07101b;background:linear-gradient(135deg,var(--cyan),#8af0d0);font-weight:900;box-shadow:0 8px 28px rgba(85,230,255,.2)}
    .dashboard{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,.7fr);gap:18px}.main,.rail{display:grid;gap:18px;align-content:start}.panel{position:relative;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(23,32,61,.82),rgba(9,15,32,.74));box-shadow:var(--shadow);backdrop-filter:blur(20px);overflow:hidden}.panel:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.055),transparent 22%)}.panel-inner{position:relative;z-index:1;padding:23px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:18px}.section-head h2{font-size:21px;margin:0}.section-head span{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.child{min-width:0;border:1px solid rgba(255,255,255,.09);border-radius:21px;background:rgba(255,255,255,.038);padding:16px}.child:nth-child(1){--kid:var(--cyan)}.child:nth-child(2){--kid:var(--violet)}.child:nth-child(3){--kid:var(--pink)}.person{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}.person strong{font-size:20px}.class{color:var(--kid);border:1px solid color-mix(in srgb,var(--kid) 40%,transparent);background:color-mix(in srgb,var(--kid) 10%,transparent);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.list{list-style:none;margin:10px 0 0;padding:0}.lesson{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0}.num{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:rgba(255,255,255,.08);color:var(--muted);font-size:12px}.subject{font-size:14px}.status{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.16)}.status.was{background:var(--kid);box-shadow:0 0 11px var(--kid)}.empty{color:var(--muted);font-size:14px;padding:16px 0}.food-text{font-size:18px;line-height:1.45;margin-top:13px}.event{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}.event:last-child{border:0}.event time{direction:ltr;color:var(--green);font-weight:900}.event small{display:block;color:var(--muted);margin-top:4px}
    .weather{min-height:220px;background:radial-gradient(circle at 25% 0,rgba(85,230,255,.20),transparent 55%),var(--panel2)}.weather-top{display:flex;justify-content:space-between;align-items:flex-start}.weather-icon{font-size:58px;filter:drop-shadow(0 8px 20px rgba(85,230,255,.28))}.weather h2{margin:0 0 5px;font-size:18px}.weather-sub{color:var(--muted)}.weather-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:25px}.stat{padding:11px 5px;border-radius:14px;background:rgba(255,255,255,.05);text-align:center}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:11px}.quote{background:radial-gradient(circle at 100% 0,rgba(255,118,207,.19),transparent 48%),var(--panel2)}.quote-mark{font-size:50px;height:33px;color:var(--pink);font-family:Georgia,serif}.quote p{font-size:22px;line-height:1.5;margin:12px 0 0;font-weight:800}.day-chip{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:999px;padding:9px 12px;color:var(--muted);font-size:13px}.day-chip i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}.legend{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px}.legend b{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 9px var(--cyan)}.footer{text-align:center;color:#657092;font-size:12px;padding:26px 0 8px;letter-spacing:.12em}
    @keyframes pulse{50%{opacity:.35;transform:scale(.7)}}@media(max-width:1020px){.dashboard{grid-template-columns:1fr}.rail{grid-template-columns:1fr 1fr}.weather{min-height:0}}@media(max-width:760px){.shell{padding:16px}.top{grid-template-columns:1fr}.top h1{font-size:46px}.nav{width:100%}.dashboard,.main,.rail{gap:12px}.cards{grid-template-columns:1fr}.rail{grid-template-columns:1fr}.panel{border-radius:22px}.panel-inner{padding:18px}.child{padding:14px}.section-head{align-items:start;flex-direction:column}.legend{display:none}}@media(max-width:390px){.nav button{padding:12px 8px;font-size:14px}.top h1{font-size:40px}.weather-stats{gap:5px}.stat b{font-size:17px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow"><span class="pulse"></span>Fridman Family OS</div><h1>היום שלנו.</h1><div id="dateText" class="date"></div></div>
      <nav class="nav" aria-label="ניווט בין ימים"><button id="nextBtn">הבא ←</button><button id="todayBtn" class="today">היום</button><button id="prevBtn">→ הקודם</button></nav>
    </header>
    <div class="dashboard">
      <div class="main">
        <section class="panel"><div class="panel-inner"><div class="section-head"><div><h2>מערכת שעות</h2><span>כל השיעורים, במבט אחד</span></div><div class="legend"><b></b> הופיע גם ביום הלימודים הקודם</div></div><div id="schoolGrid" class="cards"></div></div></section>
        <section class="panel"><div class="panel-inner"><div class="section-head"><div><h2>ארוחת עשר</h2><span>מה אורזים הבוקר</span></div></div><div id="foodGrid" class="cards"></div></div></section>
        <section class="panel"><div class="panel-inner"><div class="section-head"><div><h2>אחר הצהריים</h2><span>חוגים ופעילויות</span></div></div><div id="activityGrid" class="cards"></div></div></section>
      </div>
      <aside class="rail">
        <section class="panel weather"><div class="panel-inner"><div class="weather-top"><div><h2 id="weatherTitle">מזג האוויר</h2><div id="weatherSub" class="weather-sub">טוען תחזית…</div></div><div id="weatherIcon" class="weather-icon">◌</div></div><div id="weatherStats" class="weather-stats"></div></div></section>
        <section class="panel quote"><div class="panel-inner"><div class="quote-mark">״</div><p id="motivationText"></p></div></section>
        <div id="dayNote" class="day-chip"><i></i><span></span></div>
      </aside>
    </div>
    <footer class="footer">FRIDMAN HUB · FAMILY DASHBOARD</footer>
  </main>
  <script>
    const weekdays=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    const children={omer:{name:'עומר',className:'ב׳2'},yotam:{name:'יותם',className:'ב׳3'},noam:{name:'נועם'}};
    const school={omer:{0:['חשבון','חשבון','אקדמיה','עברית','עברית'],1:['עברית','מוסיקה','חשבון','חשבון','בשבילי המורשת'],2:['עברית','תל״ן','מפתח הלב','חשבון','חשבון','חנ״ג'],3:['מדעים בחווה','מדעים בחווה','חנ״ג','אומנות','אנגלית'],4:['עברית','עברית','כישורי חיים','אנגלית','תורה'],5:['עברית','עברית','העשרה עברית','תורה']},yotam:{0:['עברית','חנ״ג','חשבון','העשרה חשבון','מדעים בחווה','מדעים בחווה'],1:['חשבון','חשבון','עברית','עברית','בשבילי המורשת'],2:['העשרה עברית','חנ״ג','אקדמיית ספורט','אומנות','חבר על ארבע'],3:['מוזיקה','חשבון','אנגלית','עברית','עברית'],4:['עברית','כישורי חיים','חשבון','אנגלית','תורה'],5:['עברית','עברית','תורה','מפתח הלב']}};
    const snacks={yotam:{0:'טוסט קטשופ מלחם',1:'פיצה פיתה',2:'בגט טונה טוסט',3:'פיצה פיתה',4:'טוסט בגט',5:'טוסט קטשופ'},omer:{0:'לחמנייה עם חביתה',1:'פיתה וביצה קשה',2:'טוסט לבן פיתה',3:'פיצה פיתה',4:'פיתה עם ביצה קשה',5:'לחמנייה עם ריבה'}};
    const activities={0:{omer:[['15:45','אימון כדורגל','45 דק׳'],['17:15','שיעור מוזיקה','כשעה']],yotam:[['15:45','אימון כדורגל','45 דק׳'],['17:15','שיעור מוזיקה','כשעה']]},1:{yotam:[['17:00','חוג רובוטיקה']],noam:[['16:30','כדורגל']]},3:{omer:[['15:45','אימון כדורגל','45 דק׳'],['17:00','חוג STEM']],yotam:[['15:45','אימון כדורגל','45 דק׳']]},4:{yotam:[['17:30','לאה — מרפאה באמנות']]},5:{omer:[['14:00','חוג שחייה']],yotam:[['14:00','חוג שחייה']],noam:[['14:00','חוג שחייה']]}};
    const motivations=['כל יום הוא הזדמנות ללמוד משהו חדש.','חיוך קטן יכול לשנות יום שלם.','תאמינו בעצמכם — אתם יכולים יותר ממה שאתם חושבים.','הדרך להצליח מתחילה בלנסות.','תהיו סקרנים, תשאלו ותגלו דברים חדשים.','הדברים הגדולים מתחילים בצעדים קטנים.','היום הוא יום מצוין לעשות משהו טוב.','גם כשקשה — ממשיכים עוד קצת ומצליחים.','תהיו החבר שהייתם רוצים שיהיה לכם.','אין צורך להיות מושלמים — רק לעשות את הכי טוב שלכם.','כל טעות היא דרך חדשה ללמוד.','מילה טובה עושה טוב גם למי שאומר אותה.','תיהנו מהדרך, לא רק מהתוצאה.','יש לכם כוח להפוך את היום הזה למיוחד.'];
    let selectedDate=new Date(); selectedDate.setHours(12,0,0,0); let weatherDaily=null; let weatherLocation={name:'קריית אונו',latitude:32.0564,longitude:34.8579};
    const header=k=>`<div class="person"><strong>${children[k].name}</strong>${children[k].className?`<span class="class">כיתה ${children[k].className}</span>`:''}</div>`;
    const previousSchoolDay=d=>d===0||d===6?5:d-1;
    function schoolCard(k,d){const s=school[k]?.[d],prev=school[k]?.[previousSchoolDay(d)]||[];return `<article class="child">${header(k)}${s?`<ul class="list">${s.map((x,i)=>`<li class="lesson"><span class="num">${i+1}</span><span class="subject">${x}</span><span class="status ${prev.includes(x)?'was':''}" title="${prev.includes(x)?'היה ביום הלימודים הקודם':'לא היה ביום הלימודים הקודם'}"></span></li>`).join('')}</ul>`:'<div class="empty">אין לימודים היום</div>'}</article>`}
    function foodCard(k,d){const f=snacks[k]?.[d];return `<article class="child">${header(k)}${f?`<div class="food-text">${f}</div>`:'<div class="empty">אין ארוחה מוגדרת</div>'}</article>`}
    function activityCard(k,d){const a=activities[d]?.[k]||[];return `<article class="child">${header(k)}${a.length?`<ul class="list">${a.map(x=>`<li class="event"><time>${x[0]}</time><span><b>${x[1]}</b>${x[2]?`<small>${x[2]}</small>`:''}</span></li>`).join('')}</ul>`:'<div class="empty">ערב פנוי</div>'}</article>`}
    const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    function weatherInfo(c){if(c===0)return['☀️','בהיר'];if([1,2].includes(c))return['🌤️','מעונן חלקית'];if(c===3)return['☁️','מעונן'];if([61,63,65,80,81,82].includes(c))return['🌧️','גשם'];if([95,96,99].includes(c))return['⛈️','סופות רעמים'];return['🌦️','מזג אוויר משתנה']}
    function renderWeather(){if(!weatherDaily)return;const i=weatherDaily.time.indexOf(dateKey(selectedDate));weatherTitle.textContent=`מזג האוויר · ${weatherLocation.name}`;if(i<0){weatherSub.textContent='אין תחזית זמינה לתאריך הזה';weatherStats.innerHTML='';return}const w=weatherInfo(weatherDaily.weather_code[i]);weatherIcon.textContent=w[0];weatherSub.textContent=w[1];weatherStats.innerHTML=`<div class="stat"><b>${Math.round(weatherDaily.temperature_2m_max[i])}°</b><span>מקסימום</span></div><div class="stat"><b>${Math.round(weatherDaily.temperature_2m_min[i])}°</b><span>מינימום</span></div><div class="stat"><b>${weatherDaily.precipitation_probability_max[i]??0}%</b><span>סיכוי לגשם</span></div>`}
    async function fetchWeather(){try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${weatherLocation.latitude}&longitude=${weatherLocation.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`);weatherDaily=(await r.json()).daily;renderWeather()}catch{weatherSub.textContent='לא ניתן לקבל את התחזית כרגע'}}
    function motivationFor(d){const start=new Date(d.getFullYear(),0,0),day=Math.floor((d-start)/86400000);return motivations[day%motivations.length]}
    function render(){const d=selectedDate.getDay(),keys=['omer','yotam','noam'];dateText.textContent=new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(selectedDate);motivationText.textContent=motivationFor(selectedDate);dayNote.querySelector('span').textContent=d===6?'שבת — אין לימודים':`יום ${weekdays[d]} · הכול מוכן ליום חדש`;schoolGrid.innerHTML=keys.map(k=>schoolCard(k,d)).join('');foodGrid.innerHTML=keys.map(k=>foodCard(k,d)).join('');activityGrid.innerHTML=keys.map(k=>activityCard(k,d)).join('');renderWeather()}
    prevBtn.onclick=()=>{selectedDate.setDate(selectedDate.getDate()-1);render()}; nextBtn.onclick=()=>{selectedDate.setDate(selectedDate.getDate()+1);render()}; todayBtn.onclick=()=>{selectedDate=new Date();selectedDate.setHours(12,0,0,0);render()};
    render(); if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{weatherLocation={name:'המיקום שלי',latitude:p.coords.latitude,longitude:p.coords.longitude};fetchWeather()},fetchWeather,{timeout:3500});else fetchWeather();
  </script>
</body>
</html>
